  NEON_DATABASE_URL_REDESUPERPOPULAR: ${{ secrets.NEON_DATABASE_URL_REDESUPERPOPULAR }}
  NEON_DATABASE_URL_SANTALUCIA: ${{ secrets.NEON_DATABASE_URL_SANTALUCIA }}
  NEON_DATABASE_URL_SAOJOAO: ${{ secrets.NEON_DATABASE_URL_SAOJOAO }}
  NEON_DATABASE_URL_VENANCIO: ${{ secrets.NEON_DATABASE_URL_VENANCIO }}

jobs:
  band-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Count offers per price band
        run: node scripts/band-counts.cjs
