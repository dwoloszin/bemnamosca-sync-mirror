name: Price band census

# Read-only, on demand: counts available offers per price band across every
# store, to size a MIN_VALUE change before committing to it. Lives here
# because this runner reaches all forty Neon databases in minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEON_DATABASE_URL_DROGALESTE: ${{ secrets.NEON_DATABASE_URL_DROGALESTE }}
  NEON_DATABASE_URL_DROGASIL: ${{ secrets.NEON_DATABASE_URL_DROGASIL }}
  NEON_DATABASE_URL_DROGARAIA: ${{ secrets.NEON_DATABASE_URL_DROGARAIA }}
  NEON_DATABASE_URL_DROGARIASAOPAULO: ${{ secrets.NEON_DATABASE_URL_DROGARIASAOPAULO }}
  NEON_DATABASE_URL_ULTRAFARMA: ${{ secrets.NEON_DATABASE_URL_ULTRAFARMA }}
  NEON_DATABASE_URL_PAGUEMENOS: ${{ secrets.NEON_DATABASE_URL_PAGUEMENOS }}
  NEON_DATABASE_URL_FARMAIS: ${{ secrets.NEON_DATABASE_URL_FARMAIS }}
  NEON_DATABASE_URL_PANVEL: ${{ secrets.NEON_DATABASE_URL_PANVEL }}
  NEON_DATABASE_URL_FARMACIASAPP: ${{ secrets.NEON_DATABASE_URL_FARMACIASAPP }}
  NEON_DATABASE_URL_FARMACONDE: ${{ secrets.NEON_DATABASE_URL_FARMACONDE }}
  NEON_DATABASE_URL_EUALIRIA: ${{ secrets.NEON_DATABASE_URL_EUALIRIA }}
  NEON_DATABASE_URL_AGILLEMED: ${{ secrets.NEON_DATABASE_URL_AGILLEMED }}
  NEON_DATABASE_URL_NOVAMED: ${{ secrets.NEON_DATABASE_URL_NOVAMED }}
  NEON_DATABASE_URL_PHARMED: ${{ secrets.NEON_DATABASE_URL_PHARMED }}
  NEON_DATABASE_URL_JUSTMEDICAMENTOS: ${{ secrets.NEON_DATABASE_URL_JUSTMEDICAMENTOS }}
  NEON_DATABASE_URL_GHFARMA: ${{ secrets.NEON_DATABASE_URL_GHFARMA }}
  NEON_DATABASE_URL_LEVITTA: ${{ secrets.NEON_DATABASE_URL_LEVITTA }}
  NEON_DATABASE_URL_DINAMICA: ${{ secrets.NEON_DATABASE_URL_DINAMICA }}
  NEON_DATABASE_URL_FACILITA: ${{ secrets.NEON_DATABASE_URL_FACILITA }}
  NEON_DATABASE_URL_PACHECO: ${{ secrets.NEON_DATABASE_URL_PACHECO }}
  NEON_DATABASE_URL_MEVOFARMA: ${{ secrets.NEON_DATABASE_URL_MEVOFARMA }}
  NEON_DATABASE_URL_SINGULAR: ${{ secrets.NEON_DATABASE_URL_SINGULAR }}
  NEON_DATABASE_URL_MUNDIAL: ${{ secrets.NEON_DATABASE_URL_MUNDIAL }}
  NEON_DATABASE_URL_REMED: ${{ secrets.NEON_DATABASE_URL_REMED }}
  NEON_DATABASE_URL_FAST: ${{ secrets.NEON_DATABASE_URL_FAST }}
  NEON_DATABASE_URL_PROGOODS: ${{ secrets.NEON_DATABASE_URL_PROGOODS }}
  NEON_DATABASE_URL_HERA: ${{ secrets.NEON_DATABASE_URL_HERA }}
  NEON_DATABASE_URL_CAMPEA: ${{ secrets.NEON_DATABASE_URL_CAMPEA }}
  NEON_DATABASE_URL_INTEGRAL: ${{ secrets.NEON_DATABASE_URL_INTEGRAL }}
  NEON_DATABASE_URL_QUALIDOC: ${{ secrets.NEON_DATABASE_URL_QUALIDOC }}
  NEON_DATABASE_URL_ALIANZA: ${{ secrets.NEON_DATABASE_URL_ALIANZA }}
  NEON_DATABASE_URL_ONCOEXPRESSO: ${{ secrets.NEON_DATABASE_URL_ONCOEXPRESSO }}
  NEON_DATABASE_URL_ONCOHEALTHMEDICAMENTOS: ${{ secrets.NEON_DATABASE_URL_ONCOHEALTHMEDICAMENTOS }}
  NEON_DATABASE_URL_LJ_ONCOEXPRESS: ${{ secrets.NEON_DATABASE_URL_LJ_ONCOEXPRESS }}
  NEON_DATABASE_URL_FARMSAOPAULO: ${{ secrets.NEON_DATABASE_URL_FARMSAOPAULO }}
  NEON_DATABASE_URL_NISSEI: ${{ secrets.NEON_DATABASE_URL_NISSEI }}
  NEON_DATABASE_URL_DROGAL: ${{ secrets.NEON_DATABASE_URL_DROGAL }}
  NEON_DATABASE_URL_VERACRUZ: ${{ secrets.NEON_DATABASE_URL_VERACRUZ }}
  NEON_DATABASE_URL_FARMAGERTY: ${{ secrets.NEON_DATABASE_URL_FARMAGERTY }}
  NEON_DATABASE_URL_SAMPHARMA: ${{ secrets.NEON_DATABASE_URL_SAMPHARMA }}
  NEON_DATABASE_URL_ANOSSADROGARIA: ${{ secrets.NEON_DATABASE_URL_ANOSSADROGARIA }}
  NEON_DATABASE_URL_ARAUJO: ${{ secrets.NEON_DATABASE_URL_ARAUJO }}
  NEON_DATABASE_URL_CALLFARMA: ${{ secrets.NEON_DATABASE_URL_CALLFARMA }}
